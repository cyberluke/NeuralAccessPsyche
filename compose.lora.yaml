name: neuralaccesspsyche-lora
services:
  sglang:
    extends:
      file: compose.yaml
      service: sglang
    environment:
      MAX_RUNNING_REQUESTS: "3"
      MAX_LORAS_PER_BATCH: "3"
      SOURCE_MICROBATCH_SIZE: "1"
    command: ["python3", "-m", "sglang.launch_server", "--enable-lora", "--max-lora-rank", "16", "--lora-target-modules", "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj", "--lora-paths", "/fixtures/zero,/fixtures/small-delta", "--max-loras-per-batch", "3"]
    volumes:
      - ./artifacts/training/fixtures/zero:/fixtures/zero:ro
      - ./artifacts/training/fixtures/small-delta:/fixtures/small-delta:ro
