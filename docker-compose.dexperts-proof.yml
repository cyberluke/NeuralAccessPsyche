# NRAM V5 R5 - DExperts Mechanism Proof Docker Compose
#
# This compose file runs the DExperts mechanism proof experiment
# with Qwen3-0.6B-Base (Regime A).
#
# Purpose: Verify DExperts algorithm correctness with small base model
# Critical: NO system prompts, NO chat template, NO safety steering
#
# Usage:
#   docker compose -f docker-compose.dexperts-proof.yml up -d
#   # Wait for healthy, then run:
#   python scripts/dexperts_causal_ablation.py --regime 06b --n-prompts 50

services:
  sglang-dexperts-proof:
    build:
      context: .
      dockerfile: inference/sglang/Dockerfile
    container_name: nram-sglang-06b
    runtime: nvidia
    ipc: host
    shm_size: "16gb"
    environment:
      - MODEL_PATH=/root/.cache/huggingface/hub/models--Qwen--Qwen3-0.6B-Base/snapshots/da87bfb608c14b7cf20ba1ce41287e8de496c0cd
      - TOKENIZER_PATH=/root/.cache/huggingface/hub/models--Qwen--Qwen3-0.6B-Base/snapshots/da87bfb608c14b7cf20ba1ce41287e8de496c0cd
      - SERVED_MODEL_NAME=qwen3-0.6b-base
      - MODEL_TYPE=auto
      - LOAD_FORMAT=auto
      - QUANTIZATION=none
      - CONTEXT_LENGTH=2048
      - MEM_FRACTION_STATIC=0.85
      - GRAMMAR_BACKEND=xgrammar
      - ENABLE_THINKING=false
      - REASONING_PARSER=qwen3
      - HICACHE_RATIO=0.0
      - HICACHE_WRITE_POLICY=write_through_selective
      - SGLANG_HOST=0.0.0.0
      - SGLANG_PORT=30000
      - MAX_RUNNING_REQUESTS=1
      - CUDA_GRAPH_BS_DECODE=
      - NRAM_ENABLE_HOOKS=false
    volumes:
      # Mount entire HF cache so symlinks resolve correctly
      - E:/_MODELS/huggingface:/root/.cache/huggingface:ro
      - ./artifacts/dexperts/adapters:/adapters:ro
      - hf-cache-06b:/root/.cache/huggingface_write
    ports:
      - "127.0.0.1:30001:30000"
    healthcheck:
      test: ["CMD", "python3", "/opt/nram/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped

networks:
  default:
    name: nram-dexperts-proof-network

volumes:
  hf-cache-06b:
    name: neuralaccesspsyche_hf-cache-06b